<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея виноградок</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { margin-top: 0; font-size: 26px; }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }
        .gallery img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .btn-photos {
            display: block;
            padding: 12px 24px;
            background-color: #ff8c00;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }
        .btn-yt {
            display: block;
            padding: 12px 24px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }
        .btn-insta {
            display: block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }
        .btn-scratches {
            display: block;
            padding: 12px 24px;
            background-color: #8e44ad;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            color: #ffffff;
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🍇 Галерея Винограда</h1>
        
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1537640538966-79f369143f8f?auto=format&fit=crop&w=600&q=80" alt="Виноград">
        </div>

        <div class="buttons-container">
            <a href="photos.html" class="btn-photos">📸 Фотки</a>
            <a href="https://youtube.com/@daryna-f5r?si=8T0jPGK9op9B8xRd" target="_blank" class="btn-yt">📺 Мой YouTube канал</a>
            <a href="https://www.instagram.com/daryna6306?stkn=dmdkMzV3Y3M2ZXdw" target="_blank" class="btn-insta">📷 Мой Instagram</a>
            <a href="scratches.html" class="btn-scratches">🐾 Царапки</a>
        </div>
        
        <a href="index.html" class="btn-back">← Назад на главную</a>
    </div>

</body>
</html>
