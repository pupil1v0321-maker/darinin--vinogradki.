<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ціни</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .prices-button {
      margin-top: 40px;
      padding: 18px 45px;
      font-size: 24px;
      font-weight: bold;
      color: #000;
      background: #ffd21f;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .prices-button:hover {
      background: #ffdf4d;
    }

    /* Рожеве полотно */
    .price-screen {
      display: none;
      margin: 30px auto;
      padding: 35px 20px;
      max-width: 500px;
      background: #ff8fc7;
      border-radius: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .price-screen h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .price {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    .close-button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #fff;
    }
  </style>
</head>

<body>

  <button class="prices-button" onclick="showPrices()">
    Ціни
  </button>

  <div class="price-screen" id="priceScreen">
    <h1>💰 Ціни</h1>

    <div class="price">
      Одна царапка — 15 € за штуку
    </div>

    <div class="price">
      Одна виноградка — 30 € за штуку
    </div>

    <button class="close-button" onclick="hidePrices()">
      Закрити
    </button>
  </div>

  <script>
    function showPrices() {
      document.getElementById("priceScreen").style.display = "block";
    }

    function hidePrices() {
      document.getElementById("priceScreen").style.display = "none";
    }
  </script>

</body>
</html>
