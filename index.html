<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виноградки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-top: 0; font-size: 26px; }
        p { font-size: 16px; line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #ffffff;
            color: #6a11cb;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🍇 Виноградки</h1>
        <p>Добро пожаловать! Это первая официальная страница виноградок.</p>
        <a href="grapes.html" class="btn">Подробнее</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ціни</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .prices-button {
      margin-top: 40px;
      padding: 18px 45px;
      font-size: 24px;
      font-weight: bold;
      color: #000;
      background: #ffd21f;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .prices-button:hover {
      background: #ffdf4d;
    }

    /* Рожеве полотно */
    .price-screen {
      display: none;
      margin: 30px auto;
      padding: 35px 20px;
      max-width: 500px;
      background: #ff8fc7;
      border-radius: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .price-screen h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .price {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    .close-button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #fff;
    }
  </style>
</head>

<body>

  <button class="prices-button" onclick="showPrices()">
    Ціни
  </button>

  <div class="price-screen" id="priceScreen">
    <h1>💰 Ціни</h1>

    <div class="price">
      Одна царапка — 15 € за штуку
    </div>

    <div class="price">
      Одна виноградка — 30 € за штуку
    </div>

    <button class="close-button" onclick="hidePrices()">
      Закрити
    </button>
  </div>

  <script>
    function showPrices() {
      document.getElementById("priceScreen").style.display = "block";
    }

    function hidePrices() {
      document.getElementById("priceScreen").style.display = "none";
    }
  </script>

</body>
</html>
