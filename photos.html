<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зелёный виноград</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { margin-top: 0; font-size: 24px; }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }
        .gallery img {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            object-fit: cover;
        }
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            color: #ffffff;
            text-decoration: underline;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🟢 Зелёный виноград</h1>
        
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1596368708356-6e1e1025ee72?auto=format&fit=crop&w=800&q=80" alt="Гроздь зеленого винограда">
            <img src="https://images.unsplash.com/photo-1537640538966-79f369143f8f?auto=format&fit=crop&w=800&q=80" alt="Сочные ягоды">
        </div>

        <a href="grapes.html" class="btn-back">← Назад в галерею</a>
    </div>

</body>
</html>
