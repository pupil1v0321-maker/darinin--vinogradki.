<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепт Царапок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #8e44ad 0%, #c0392b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 24px;
        }

        .recipe-box {
            background: rgba(0, 0, 0, 0.25);
            padding: 18px;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.5;
            text-align: left;
            margin: 15px 0;
        }

        .btn-back {
            display: inline-block;
            margin-top: 10px;
            color: #ffffff;
            text-decoration: underline;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🐾 Рецепт царапок</h1>
        
        <div class="recipe-box">
            Рецепт царапок: Берем одну салфетку потом чуть чуть мочим салфетку потом ее складуем два раза потом напополам ее открываем на мокрую салфетку еще сыпем сахар и потом салфетку открываем как она была изначальной и ваша царапка готова⭐
        </div>

        <a href="grapes.html" class="btn-back">← Назад в галерею</a>
    </div>

</body>
</html>
