<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Соц. Авторов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 26px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-yt {
            display: block;
            padding: 12px 24px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }

        .btn-tiktok {
            display: block;
            padding: 12px 24px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #ffffff;
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌿 Соц. Авторов</h1>

        <div class="buttons-container">
            <a href="https://youtube.com/@ivanrudy-cl6if?si=Yfb5bJRH7LLnARU3" target="_blank" class="btn-yt">📺 Ютуб создателя</a>
            <a href="https://youtube.com/@plat-ua?si=tmVULE_8BJlTykSs" target="_blank" class="btn-yt">📺 Ютуб помощника</a>
            <a href="https://www.tiktok.com/@melocotonius" target="_blank" class="btn-tiktok">🎵 Тикток создателя</a>
        </div>
        
        <a href="grapes.html" class="btn-back">← Назад в галерею</a>
    </div>

</body>
</html>
